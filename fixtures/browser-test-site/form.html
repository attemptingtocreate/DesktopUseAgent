<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Form Fixture</title>
</head>
<body>
  <h1>Contact Form</h1>
  <form id="contact" data-testid="contact-form">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" placeholder="Enter full name" data-testid="name-input" />

    <label for="email">Email</label>
    <input id="email" name="email" type="email" placeholder="you@example.com" data-testid="email-input" />

    <label for="country">Country</label>
    <select id="country" name="country" data-testid="country-select" aria-label="Country">
      <option value="">Select</option>
      <option value="us">United States</option>
      <option value="ca">Canada</option>
      <option value="uk">United Kingdom</option>
    </select>

    <button type="submit" id="submit" data-testid="submit-button" role="button" aria-label="Submit form">Submit</button>
  </form>
  <div id="result" data-testid="form-result" role="status" aria-label="Form result" hidden></div>
  <script>
    document.getElementById('contact').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const country = document.getElementById('country').value;
      const result = document.getElementById('result');
      result.hidden = false;
      result.textContent = `Submitted:${name}|${email}|${country}`;
    });
  </script>
</body>
</html>
